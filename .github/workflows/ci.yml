name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The release job's artifacts expire, and it is the only producer of the
  # per-architecture binaries and their checksums. Without this, getting them back
  # means an empty commit.
  workflow_dispatch:

# Cancel superseded branch runs; let `main` finish, since each commit there is a
# distinct set of musl artifacts that nothing else produces.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # A failure in the PTY suite is awkward to reproduce off the runner, so keep the
  # backtrace in the log.
  RUST_BACKTRACE: 1

# Third-party actions are pinned to a commit, not to a tag: the release job below
# builds the four binaries whose SHA-256 the client is designed to pin, and a tag is a
# mutable pointer in someone else's repository. The version rides in the trailing
# comment, since the SHA does not say which one it is. The `actions/*` steps stay on
# their major tag deliberately — GitHub's own, inside a trust boundary the job is
# already entirely within.
jobs:
  # The prek gate, run in the same cheapest-first order. One job, so the workspace
  # and its dependencies are compiled against a single cache.
  check:
    name: fmt, clippy, tests
    runs-on: ubuntu-latest
    # The session tests spawn a real PTY, shells and unix sockets; a wedged child
    # would otherwise hold the runner for the six-hour default.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      # Bare `toolchain install` reads rust-toolchain.toml, so the 1.97.1 pin and
      # its components stay stated in exactly one place.
      - name: Install the pinned toolchain
        run: rustup toolchain install --profile minimal --no-self-update

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      # Prebuilt binary; `cargo install` would build nextest from source on every
      # cache miss.
      - uses: taiki-e/install-action@67729d5c413db75907f0ad1e39bb04b9c868ff60 # v2.85.7
        with:
          tool: cargo-nextest

      # Every tracked `*.sh`, not `scripts/*.sh`: the prek hook matches the path
      # suffix wherever it lands, and the gate that runs on a `--no-verify` commit is
      # the wrong one to have checking less than the local hook does.
      # `shell: bash` for the `-o pipefail` it brings: the default `bash -e {0}` has
      # none, so a failing `git ls-files` would be masked by the zero `xargs` exits
      # when handed nothing, and the step would pass having checked no files.
      - run: git ls-files -z '*.sh' | xargs -0 -r shellcheck --shell=sh
        shell: bash

      - run: cargo fmt --all --check

      # No `-D warnings`: the deny lives in [workspace.lints] in Cargo.toml, which is
      # where the reason is written down.
      - run: cargo clippy --locked --workspace --all-targets

      # `--run-ignored all`: the one ignored test sits out a real reaping timeout,
      # the 30 s first-attach one. Too slow for a pre-commit hook, exactly what
      # CI is for.
      # `--no-fail-fast`: one failure should not hide the state of everything
      # else, which is most of the value of a CI run over a local one.
      - run: cargo nextest run --locked --workspace --run-ignored all --no-fail-fast

      # nextest cannot run doctests.
      - run: cargo test --locked --doc --workspace

  # Its own job: the script rebuilds `nomux` and its session tests under
  # `--cfg nomux_fault_injection`, which shares no artifacts with the job above, and
  # keeping it parallel leaves it off the critical path.
  takeover-guard:
    name: takeover guard
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Install the pinned toolchain
        run: rustup toolchain install --profile minimal --no-self-update

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          # Separate target directory, separate fingerprints, separate cache.
          key: fault-injection

      - uses: taiki-e/install-action@67729d5c413db75907f0ad1e39bb04b9c868ff60 # v2.85.7
        with:
          tool: cargo-nextest

      # Asserts the regression test still fails on the pre-fix ordering; a guard that
      # passes on the bug guards nothing.
      - run: sh scripts/verify-takeover-guard.sh

  # The 400 KiB budget is correctness-adjacent — the cold upload happens over
  # cellular — and is the one thing the local hooks cannot check.
  release:
    name: musl release builds
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      # Read rather than repeated here: scripts/build-release.sh defaults to the same
      # file, so this job and a laptop build use one compiler and their sizes are
      # comparable against a baseline recorded by it. A literal here would let the two
      # drift, which is how a local run comes to fail on growth nobody introduced.
      #
      # A plain assignment rather than `echo "...=$(cat ...)"`, because the default
      # shell is `bash -e` without `pipefail`: a failing substitution inside `echo`
      # does not fail `echo`, so a renamed or missing file left this step green with
      # an empty value — for the one file that names the release compiler. `set -e`
      # does fail an assignment whose substitution failed.
      #
      # An output rather than $GITHUB_ENV, because $GITHUB_ENV would put NOMUX_NIGHTLY
      # in the environment of every later step, including the build. That variable is
      # the script's override, and IMPLEMENTATION.md § 8 says a release may not take
      # it. As an output it reaches only the step below, so build-release.sh reads
      # scripts/nightly-version itself — the same branch a laptop build takes.
      - name: Read the pinned release nightly
        id: nightly
        run: |
          nightly=$(cat scripts/nightly-version)
          # Checked rather than passed on, because two readers parse this file and
          # they parse it differently: build-release.sh takes it whole with `cat`,
          # while $GITHUB_OUTPUT is line-oriented, so a second line would install one
          # compiler and build with another. Empty is the same class of problem from
          # the other side — `cat` succeeds on an empty file, so the assignment above
          # cannot catch it, and the failure surfaces a step later as a rustup usage
          # error about a file this step has already read. One plain toolchain name
          # is all either reader accepts; anything else stops here, next to the file.
          case "$nightly" in
              '' | *[!A-Za-z0-9._-]*)
                  echo "scripts/nightly-version names the release compiler and must" >&2
                  echo "  hold one plain toolchain name; it holds: '$nightly'" >&2
                  exit 1
                  ;;
          esac
          echo "version=$nightly" >> "$GITHUB_OUTPUT"

      # The shipping build rebuilds std with panics compiled out, which needs a
      # nightly compiler plus its sources (IMPLEMENTATION.md § 8).
      #
      # Through `env:` and a quoted expansion, not `${{ }}` spliced into the script:
      # on a pull request the file's contents are the contributor's, and a value
      # interpolated into `run:` is executed rather than passed.
      - name: Install the release nightly with the musl targets
        env:
          RELEASE_NIGHTLY: ${{ steps.nightly.outputs.version }}
        run: >
          rustup toolchain install "$RELEASE_NIGHTLY" --profile minimal --no-self-update
          --component rust-src
          --target x86_64-unknown-linux-musl,aarch64-unknown-linux-musl,armv7-unknown-linux-musleabihf,riscv64gc-unknown-linux-musl

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: musl-${{ steps.nightly.outputs.version }}

      # Owns the target list and the size budget; exits non-zero if a binary is over.
      - run: sh scripts/build-release.sh

      # The checksums are the point of this job — the client pins one per
      # architecture — so they have to outlive the log they were printed to.
      - uses: actions/upload-artifact@v7
        with:
          name: musl-binaries
          path: target/dist/
          if-no-files-found: error

