name: CI

on:
  push:
    branches: [main]
    # A `v*` tag publishes a release: the `publish` job promotes the exact bytes the release
    # job built, so the published checksums are the ones the size gate computed over. A
    # rebuild would be byte-identical by § 8, but "would be" is a claim and this is not one.
    tags: ['v*']
  pull_request:
    # Not on `push` above, which owes every main commit a set of artifacts. Branch
    # protection is off; turning it on makes a skipped job sit "expected" for ever.
    paths-ignore: ['**/*.md', 'LICENSE']
  # The release job's artifacts expire, and it is the only producer of the
  # per-architecture binaries and their checksums. Without this, getting them back
  # means an empty commit.
  workflow_dispatch:

# Cancel superseded branch runs; let `main` finish, since each commit there is a
# distinct set of musl artifacts that nothing else produces.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # A failure in the PTY suite is awkward to reproduce off the runner, so keep the
  # backtrace in the log.
  RUST_BACKTRACE: 1

# Third-party actions are pinned to a commit, not a tag: a tag is a mutable pointer in
# someone else's repository, and the release job builds the binaries whose SHA-256 the client
# pins. The version rides in the trailing comment. `actions/*` stay on their major tag —
# GitHub's own, inside a trust boundary the job is already entirely within.
jobs:
  # One job, so the workspace and its dependencies are compiled against a single cache.
  check:
    name: fmt, clippy, tests
    runs-on: ubuntu-latest
    # The session tests spawn a real PTY, shells and unix sockets; a wedged child
    # would otherwise hold the runner for the six-hour default.
    timeout-minutes: 20
    # Job-level rather than per step, so every cargo below sees one value: RUSTFLAGS is part
    # of cargo's fingerprint and of the rust-cache key, and a step that differed would
    # rebuild from cold. Why the deny lives here rather than in [workspace.lints] is in
    # Cargo.toml. Not on the release job, whose script sets CARGO_ENCODED_RUSTFLAGS — which
    # makes cargo ignore RUSTFLAGS entirely, so a deny there would be silently absent.
    env:
      RUSTFLAGS: -D warnings
    steps:
      # `persist-credentials: false`: nothing in this workflow pushes, and the default
      # leaves the job token in .git/config while a step below executes `entry:` shell out
      # of the pull request's own .pre-commit-config.yaml.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # A tag naming a version nobody bumped otherwise burns every job in this workflow
      # before failing on a one-line comparison. The `publish` job asks the built binary the
      # same question and remains the authority; this only moves the answer an hour earlier.
      - name: Check the tag names the workspace version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(awk -F'"' '/^version *=/ { print $2; exit }' Cargo.toml)
          [ "$version" = "${GITHUB_REF_NAME#v}" ] ||
              { echo "tag $GITHUB_REF_NAME does not name Cargo.toml's $version" >&2; exit 1; }

      # Bare `toolchain install` reads rust-toolchain.toml, so the 1.97.1 pin and
      # its components stay stated in exactly one place.
      - name: Install the pinned toolchain
        run: rustup toolchain install --profile minimal --no-self-update

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      # Prebuilt binaries; `cargo install` would build each from source on every
      # cache miss. shellcheck too, so what fails a build is a pinned version rather than
      # whatever the runner image happens to ship this week.
      - uses: taiki-e/install-action@67729d5c413db75907f0ad1e39bb04b9c868ff60 # v2.85.7
        with:
          tool: cargo-nextest,cargo-deny,prek,shellcheck

      # Advisories, because dependabot bumps monthly and a CVE does not wait; licences and
      # sources, because the binary ships other people's object code. `--locked`, and before
      # the subcommand where it is cargo-deny's own option: this is the job's first cargo and
      # it shells out to `cargo metadata`, which rewrites a stale lock to make itself work.
      - run: cargo deny --locked check advisories bans licenses sources

      # The released binary, by checksum. Built from source it would need a Go
      # toolchain — the only one this tree has any use for — and the image's Go is an
      # unpinned input, so a release raising its Go floor breaks hook *installation*
      # and takes clippy, doc and the tests below with it before any of them run.
      - name: install actionlint
        env:
          VERSION: 1.7.12
          SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          tarball="actionlint_${VERSION}_linux_amd64.tar.gz"
          curl -fsSLO --retry 3 \
            "https://github.com/rhysd/actionlint/releases/download/v${VERSION}/${tarball}"
          echo "$SHA256  $tarball" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          tar -xzf "$tarball" -C "$HOME/.local/bin" actionlint
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # The gate itself, from .pre-commit-config.yaml, so a hook and the CI step
      # enforcing it cannot say different things. `--skip cargo-nextest`: the step
      # below runs a strict superset of that hook, and the session suite is too slow
      # to run twice. shellcheck and actionlint are both on $PATH by here.
      - run: prek run --all-files --skip cargo-nextest

      # rustdoc's lints are a namespace of their own, reached by neither the clippy hook nor
      # RUSTFLAGS, and a renamed item turns a link into nothing rather than into an error.
      # `--document-private-items` because the binary is almost entirely private; `--lib
      # --bins` because a bare `cargo doc` documents only the lib when both share a name.
      - run: RUSTDOCFLAGS='-D warnings' cargo doc --locked --workspace --no-deps --document-private-items --lib --bins

      # nextest cannot run doctests, so they need a pass of their own or doc examples go
      # unexercised. Here rather than in a hook: the workspace has one, which is not worth a
      # cargo front-end invocation on every commit that touches a `*.rs`.
      - run: cargo test --locked --doc --workspace

      # The cargo-nextest hook's command plus the two flags that only make sense here.
      # `--run-ignored all`: the one ignored test sits out a real reaping timeout,
      # the 30 s first-attach one. Too slow for a pre-commit hook, exactly what
      # CI is for.
      # `--no-fail-fast`: one failure should not hide the state of everything
      # else, which is most of the value of a CI run over a local one.
      - run: cargo nextest run --locked --workspace --run-ignored all --no-fail-fast

  # A matrix rather than one job running both scripts: the three builds involved — the
  # session suite under `nomux_fault_settle` and again under `nomux_fault_injection`, the
  # binary's unit tests under `nomux_fault_unreaped` — share no fingerprint with each other
  # or with the job above, so one job would compile them in series where two compile at
  # once, and rust-cache keys one blob per job. Two names, because a failure of the second
  # is about § 6.5's grace and would mislead anyone reading it under "takeover guard".
  guards:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    # A compile error is paid for once rather than in both guards at the same time.
    needs: check
    timeout-minutes: 20
    strategy:
      # Each guard answers a different question, so the second is still worth an answer when
      # the first has failed; the default would cancel it.
      fail-fast: false
      matrix:
        include:
          # Separate target directories, separate fingerprints, separate caches.
          - name: takeover guard
            guard: takeover
            key: fault-injection
          - name: hangup grace guard
            guard: hangup-grace
            key: fault-unreaped
    steps:
      - uses: actions/checkout@v7

      - name: Install the pinned toolchain
        run: rustup toolchain install --profile minimal --no-self-update

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: ${{ matrix.key }}

      - uses: taiki-e/install-action@67729d5c413db75907f0ad1e39bb04b9c868ff60 # v2.85.7
        with:
          tool: cargo-nextest

      # Asserts the regression test still fails with the fix undone; a guard that passes on
      # the bug guards nothing.
      - run: sh scripts/verify-guard.sh ${{ matrix.guard }}

  # The 400 KiB budget is correctness-adjacent — the cold upload happens over
  # cellular — and is the one thing the local hooks cannot check.
  release:
    name: musl release builds
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # Read rather than repeated here, so this job and a laptop build use one compiler and
      # their sizes are comparable (scripts/build-release.sh says why). A plain assignment
      # rather than `echo "version=$(cat ...)"`, since the default `bash -e` has no
      # `pipefail` and would leave the step green with an empty value. An output rather than
      # $GITHUB_ENV, so it reaches only the step below.
      - name: Read the pinned release nightly
        id: nightly
        run: |
          nightly=$(cat scripts/nightly-version)
          echo "version=$nightly" >> "$GITHUB_OUTPUT"

      # The shipping build rebuilds std with panics compiled out, which needs a
      # nightly compiler plus its sources (IMPLEMENTATION.md § 8). `llvm-tools` is for
      # the debug companions: the script checks each one against the binary it
      # describes with `llvm-objcopy`, and the host's binutils cannot be assumed to
      # read aarch64.
      #
      # Through `env:` and a quoted expansion, not `${{ }}` spliced into the script:
      # on a pull request the file's contents are the contributor's, and a value
      # interpolated into `run:` is executed rather than passed.
      - name: Install the release nightly with the musl targets
        env:
          RELEASE_NIGHTLY: ${{ steps.nightly.outputs.version }}
        run: >
          rustup toolchain install "$RELEASE_NIGHTLY" --profile minimal --no-self-update
          --component rust-src,llvm-tools
          --target x86_64-unknown-linux-musl,aarch64-unknown-linux-musl

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: musl-${{ steps.nightly.outputs.version }}

      # Owns the target list and the size budget; exits non-zero if a binary is over.
      # Companions everywhere except a pull request: they double the cross builds for
      # artifacts only the tag path publishes, and a PR's expire unread — while `main` and
      # tags keep the script's `.text` correspondence check running on every commit that
      # could ship. `0` rather than an unset value, because the script tests for exactly `1`.
      - run: sh scripts/build-release.sh
        env:
          NOMUX_DEBUG: ${{ github.event_name == 'pull_request' && '0' || '1' }}

      # The only place the shipping configuration is ever executed on a commit that is not
      # a tag. Nothing in the check job builds `-Zbuild-std` with `-Cpanic=immediate-abort`,
      # so without this a binary that does not start at all — a miscompiled std — passes
      # every pull request and first fails on the tag that publishes it. Both of them: the
      # tree has no `target_arch` cfg, so std and codegen are the whole divergence between
      # the two. Static, so the runner runs one and qemu-user the other.
      - name: Run the binaries that ship
        run: |
          sudo apt-get update -qq && sudo apt-get install -y qemu-user
          chmod +x target/dist/nomux-x86_64-unknown-linux-musl target/dist/nomux-aarch64-unknown-linux-musl
          target/dist/nomux-x86_64-unknown-linux-musl --version
          qemu-aarch64 target/dist/nomux-aarch64-unknown-linux-musl --version

      # The checksums are the point of this job — the client pins one per
      # architecture — so they have to outlive the log they were printed to. On a tag
      # the release below is where they actually land; this keeps every other commit's
      # set reachable for the ninety days an artifact lasts.
      - uses: actions/upload-artifact@v7
        with:
          name: musl-binaries
          path: target/dist/
          if-no-files-found: error

  # What P3 asked for: the checksums somewhere a client can read them, an artifact expiring
  # after ninety days and sitting behind a login. Its own job because it `needs` every job
  # above — so a tag cannot publish a release whose tests failed, where parallel jobs with no
  # dependency would have raced — and because it is the only one that wants a write token,
  # which is why the other three keep the read-only one the header grants.
  publish:
    name: publish the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, guards, release]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # No checkout: everything published is in the artifact, and the tag is named by
      # the ref rather than read out of the tree.
      - uses: actions/download-artifact@v7
        with:
          name: musl-binaries
          path: dist

      # The check every download page asks a user to run, run here first — against the
      # artifact that came back out of the store rather than the one that went in. It
      # also settles what is present: `sha256sum -c` fails on a file it cannot open, so
      # a manifest naming something the build did not emit stops here.
      - name: Verify the artifact against its own checksums
        working-directory: dist
        run: |
          sha256sum -c SHA256SUMS
          sha256sum -c SHA256SUMS.debug

      # Artifacts do not carry the executable bit, and the step below runs one to ask its
      # version. No bearing on what is published — every install path chmods it anyway.
      - run: chmod +x dist/nomux-*

      # Asked of the artifact rather than read out of Cargo.toml — the tag's whole job is to
      # name what these binaries are, and the x86_64 musl binary is static-pie on an x86_64
      # runner, so the one witness to the version that ships can simply be asked. The `check`
      # job compares the same tag against Cargo.toml an hour earlier; this is the authority.
      # Before anything is published, because a tag cannot be quietly corrected: the sums
      # under `v0.1.0` are what a client pins.
      - name: Check the tag names the version the binaries report
        run: |
          built=$(dist/nomux-x86_64-unknown-linux-musl --version)
          case "$built" in
          "nomux ${GITHUB_REF_NAME#v} "*) ;;
          *)
              echo "the tag $GITHUB_REF_NAME does not name what the binaries report:" >&2
              echo "  $built" >&2
              echo "  move the workspace version in Cargo.toml, or retag." >&2
              exit 1
              ;;
          esac

      # `SHA256SUMS` goes up beside the binaries it covers, in the format `sha256sum -c` reads,
      # so verifying needs no API and no tooling. GitHub also computes an immutable SHA-256 per
      # asset, exposed as `digest` on the releases API — worth both, the file being portable and
      # signed by nothing while the digest is GitHub's and unrewritable. The body carries the
      # sums inline so the number a human compares is on the page they are reading already.
      # `--verify-tag`, so a ref naming no tag fails rather than creating one nobody tagged.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          notes="$RUNNER_TEMP/notes.md"
          {
              echo "Static Linux binaries, one per architecture. Verify with:"
              echo
              echo '```sh'
              echo 'sha256sum -c SHA256SUMS'
              echo '```'
              echo
              echo '```'
              cat dist/SHA256SUMS
              echo '```'
              echo
              echo "### Debug companions"
              echo
              echo "\`nomux-<target>.debug\` is the same build unstripped, for reading a"
              echo "\`SIGQUIT\` core against — the shipping binaries carry no symbols and"
              echo "abort without a message. Nothing needs them to run nomux. Their own"
              echo "sums are in \`SHA256SUMS.debug\`."
              echo
              echo '```'
              cat dist/SHA256SUMS.debug
              echo '```'
          } > "$notes"
          # Exactly what the two manifests name, rather than a `dist/nomux-*` glob that would
          # sweep the companions in beside the binaries: the sets are checksummed separately
          # and a glob does not know which is which. Counted, because `set -e` does not see
          # into a process substitution — a failed awk would publish two manifests and no
          # binaries, and a tag cannot be amended. Two architectures and companions is four.
          mapfile -t assets < <(awk '{print "dist/" $2}' dist/SHA256SUMS dist/SHA256SUMS.debug)
          if [ "${#assets[@]}" -ne 4 ]; then
              echo "the manifests name ${#assets[@]} files, not the expected 4:" >&2
              printf '  %s\n' "${assets[@]}" >&2
              exit 1
          fi
          gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --notes-file "$notes" \
              --verify-tag \
              "${assets[@]}" dist/SHA256SUMS dist/SHA256SUMS.debug
