name: CI

on:
  push:
    branches: [main]
    # A `v*` tag publishes a release: `publish` promotes the exact bytes `release` built. A
    # rebuild would be byte-identical by § 8, but "would be" is a claim and this is not one.
    tags: ['v*']
  # No `paths-ignore`: a job a pull request skips leaves a required check sitting "expected" for
  # ever, and a documentation-only commit is exactly what scripts/check-references.sh is for.
  pull_request:
  # The advisory database moves while this tree stands still and Dependabot bumps daily, so
  # without a timer an advisory published on Tuesday waits for whoever pushes next. Weekly, two
  # direct dependencies not earning a daily run of anything. The timer exists for `cargo deny
  # check advisories` alone: `fuzz` and `release` skip scheduled runs below, `publish` is
  # tag-gated already.
  schedule:
    - cron: '17 4 * * 1'
  # The release job's artifacts expire and nothing else produces the per-architecture binaries or
  # their checksums; without this, getting them back means an empty commit.
  workflow_dispatch:

# Cancel superseded branch runs; let `main` finish, since each commit there is a distinct set of
# musl artifacts that nothing else produces.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # A failure in the PTY suite is awkward to reproduce off the runner, so keep the backtrace.
  RUST_BACKTRACE: 1

# `-e` alone, GitHub's default for `run:`, says nothing about a pipeline — `git archive | tar -x`
# below would report only tar's status. Naming the shell is what adds `pipefail`; bash rather than
# sh, the publish job reading an array. The only other pipeline here feeds sha256sum from an echo.
defaults:
  run:
    shell: bash

# Every action pinned to a commit, GitHub's own included: a tag is a mutable pointer in someone
# else's repository, and `download-artifact` feeds the one job holding `contents: write`.
jobs:
  # One job, so the workspace and its dependencies are compiled against a single cache.
  check:
    name: fmt, clippy, tests
    runs-on: ubuntu-24.04
    # A wedged PTY child would otherwise hold the runner for the six-hour default.
    timeout-minutes: 20
    # Job-level rather than per step, so every cargo below sees one value: RUSTFLAGS is part of
    # cargo's fingerprint and of the rust-cache key, and a step that differed would rebuild from
    # cold. Why the deny lives here rather than in [workspace.lints] is in Cargo.toml. Not on the
    # release job, whose script sets CARGO_ENCODED_RUSTFLAGS — which makes cargo ignore RUSTFLAGS
    # entirely, so a deny there would be silently absent. RUSTDOCFLAGS beside it because RUSTFLAGS
    # does not reach rustdoc at all. Measured: neither makes a warning *inside* a doctest fatal,
    # which needs `#![doc(test(attr(deny(warnings))))]` on the crate.
    env:
      RUSTFLAGS: -D warnings
      RUSTDOCFLAGS: -D warnings
    steps:
      # `persist-credentials: false`: nothing in this workflow pushes, and the default leaves the
      # job token in .git/config while a step below executes `entry:` shell out of the pull
      # request's own .pre-commit-config.yaml.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # A release tag must be proved to sit on protected main, which takes the
          # branch history rather than the tag commit alone.
          fetch-depth: 0

      # A tag is another route into `publish`, so require it to name a commit that already passed
      # through protected main rather than let it bypass the branch rules. The version check then
      # fails cheap, before every build, while `publish` remains the authority on the artifact.
      - name: Check the tag names a mainline workspace version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main ||
              { echo "tag $GITHUB_REF_NAME is not on protected main" >&2; exit 1; }
          version=$(awk -F'"' '/^version *=/ { print $2; exit }' Cargo.toml)
          [ "$version" = "${GITHUB_REF_NAME#v}" ] ||
              { echo "tag $GITHUB_REF_NAME does not name Cargo.toml's $version" >&2; exit 1; }

      - name: Install the pinned toolchain
        run: rustup toolchain install --profile minimal --no-self-update

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # Scheduled runs only need the advisory checker.
      - uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad # v2.85.10
        with:
          tool: ${{ github.event_name == 'schedule' && 'cargo-deny@0.20.2' || 'cargo-nextest@0.9.143,cargo-deny@0.20.2,prek@0.4.12,shellcheck@0.11.0' }}

      # Advisories alone — bans, licences and sources are the cargo-deny hook's, run by prek
      # below; this one fetches a database over the network where a hook may not. `--locked`
      # before the subcommand, where it is cargo-deny's own option: this is the job's first cargo
      # and it shells out to `cargo metadata`, which rewrites a stale lock to make itself work.
      - run: cargo deny --locked check advisories

      # fuzz/ is a separate workspace with a lock file of its own, so its dependencies are not in
      # the graph the line above walks — but its build scripts execute on this machine, which is
      # what an advisory there is about. Advisories alone: the cargo-deny-fuzz hook, run by prek
      # below, already checks sources against the same manifest and config, and fuzz/deny.toml
      # has no `[licenses]` or `[bans]` section to check. That absence is the policy, not an
      # oversight: an allow-list is about what may be distributed and `multiple-versions` is
      # about what the shipping binary costs, and fuzz/ is never distributed and never linked
      # into it. Advisories and sources are the two that are about this machine, and on those
      # two the file says exactly what the root deny.toml says.
      - run: cargo deny --locked --manifest-path fuzz/Cargo.toml --config fuzz/deny.toml check advisories

      # The released binary, by checksum: from source it needs a Go toolchain, and the image's Go
      # is an unpinned input — a release raising its Go floor would break hook *installation* and
      # take clippy, doc and the tests below with it before any of them run.
      - name: install actionlint
        if: github.event_name != 'schedule'
        env:
          VERSION: 1.7.12
          SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          tarball="actionlint_${VERSION}_linux_amd64.tar.gz"
          curl -fsSLO --retry 3 \
            "https://github.com/rhysd/actionlint/releases/download/v${VERSION}/${tarball}"
          echo "$SHA256  $tarball" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          tar -xzf "$tarball" -C "$HOME/.local/bin" actionlint
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # The gate itself, from .pre-commit-config.yaml. `--skip cargo-nextest`: the step below runs
      # a strict superset of that hook, and the session suite is too slow to run twice.
      - if: github.event_name != 'schedule'
        run: prek run --all-files --skip cargo-nextest

      # rustdoc has its own lints; include private binary modules and both targets.
      - if: github.event_name != 'schedule'
        run: cargo doc --locked --workspace --no-deps --document-private-items --lib --bins

      # nextest cannot run doctests, so they need a pass of their own. Here rather than in a hook:
      # the workspace's one is not worth a cargo front-end invocation on every commit.
      - if: github.event_name != 'schedule'
        run: cargo test --locked --doc --workspace

      # The cargo-nextest hook's command plus the two flags that only make sense here.
      # `--run-ignored all`: the one ignored test sits out a real 30 s first-attach reaping
      # timeout, too slow for a hook. `--no-fail-fast`: one failure should not hide the state of
      # everything else, which is most of the value of a CI run over a local one.
      - if: github.event_name != 'schedule'
        run: cargo nextest run --locked --workspace --run-ignored all --no-fail-fast

      # The suite above keeps the default chaos interleaving reproducible. Three more fixed
      # seeds buy different disconnect boundaries without turning a failure into an
      # unreproducible random draw; each run is only the four chaos cases.
      - name: Replay additional chaos interleavings
        if: github.event_name != 'schedule'
        run: |
          for seed in 1 11400714819323198485 15111065706836454659; do
            NOMUX_CHAOS_SEED="$seed" cargo nextest run --locked --workspace --test chaos
          done

  # Sixty seconds is not a search and this job does not pretend to be one: it checks that fuzz/
  # still compiles and still passes over its committed seeds, which is what rots in a workspace
  # sitting outside the root one and so outside every hook but `cargo fmt`. No corpus is carried
  # between runs — a cache restored from the last green commit would make what this job covers a
  # function of what happened to be cached. Release-gating: the time budget changes how much is
  # explored, not whether a crash already found in this run is safe to publish alongside.
  fuzz:
    name: fuzz targets
    runs-on: ubuntu-24.04
    # The weekly schedule exists for the advisory check alone; see the trigger comment above.
    if: github.event_name != 'schedule'
    # Behind the gate rather than beside it, alone among the jobs here: the slowest thing in the
    # workflow per unit of what it is likely to catch, and a tree that cannot pass clippy has
    # nothing worth fuzzing.
    needs: check
    timeout-minutes: 20
    steps:
      # `persist-credentials: false`, for the reason the check job gives.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The stable pin from rust-toolchain.toml, which builds cargo-fuzz and lints the crate. No
      # nightly step: fuzz/run.sh installs the shared pin from scripts/nightly-version; the cache
      # key below follows both inputs to that installation.
      - name: Install the pinned toolchain
        run: rustup toolchain install --profile minimal --no-self-update

      # `workspaces: fuzz`, fuzz/ being a workspace of its own: its lock file and target directory
      # are both under there, and the default `.` would key this cache on one it never builds.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: fuzz-${{ hashFiles('fuzz/run.sh', 'scripts/nightly-version') }}
          workspaces: fuzz

      # cargo-fuzz is in no install-action manifest, so `tool:` there falls through to
      # cargo-binstall and compiles it anyway, out of a store nothing pins. From crates.io at a
      # version named here instead; rust-cache keeps $CARGO_HOME/bin, so it is a cold-cache cost.
      - run: cargo install --locked cargo-fuzz@0.13.2

      # The only lint pass fuzz/ gets, the clippy hook reaching the root workspace alone. On
      # stable and without a sanitizer, neither of which the crate needs to type-check. The deny
      # rides on the command rather than in a job-level RUSTFLAGS: cargo-fuzz composes its
      # sanitizer flags on top of RUSTFLAGS, so one set for the job would follow into the fuzz
      # build and make a warning out of libfuzzer-sys or cc fail it.
      - run: cargo clippy --locked --manifest-path fuzz/Cargo.toml --all-targets -- -D warnings

      - run: sh fuzz/run.sh frame -max_total_time=60

      # The input that crashed, which the log holds only as a hexdump; `cargo fuzz run <target>
      # <this file>` replays it. `ignore`, not `error`: this step also runs when the clippy above
      # is what failed, and that leaves no artifact behind.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
          if-no-files-found: ignore

  # The one job that tests the promise the program exists to make: a session created in one SSH
  # login is still there after that login has logged out. It cannot be a hook and it cannot be a
  # unit test — the answer belongs to logind, so it takes systemd as PID 1, a real sshd and a real
  # PAM stack, which is why it is six privileged containers rather than a `cargo test`.
  # e2e-tests/README.md has what it proves and what it does not.
  #
  # `name:` below is the required status context on main and has to stay spelled exactly that
  # way; renaming it leaves every pull request waiting for a check that never reports.
  e2e:
    name: systemd logout matrix
    runs-on: ubuntu-24.04
    # The weekly schedule exists for the advisory check alone; see the trigger comment above.
    # Skipping a required check reports as success, which `fuzz` and `release` already rely on.
    if: github.event_name != 'schedule'
    # Behind the gate, as `fuzz` is and for its reason: a tree that cannot pass clippy has
    # nothing worth booting six containers for.
    needs: check
    # Six containers each booting systemd, plus two musl builds. e2e-tests/run.sh measured 206 s
    # here for the ten cells this matrix used to have and should sit near two minutes for six; a
    # cold cache adds the crate's and the probe's musl builds and the Debian image on top.
    #
    # The generous remainder is deliberate and is not headroom for the measurement. run.sh bounds
    # every failure it can diagnose — 90 s for a cell to accept a login, 60 s for a hold to report
    # ready, 90 s for a blackholed login to die — and dies on the first cell to exceed one, with a
    # paragraph about which. Roughly seven minutes covers a full run plus one cell exhausting all
    # three, so the timeout stays above that: a cancelled job says nothing, and this check now
    # blocks merges. What is left for it to catch is the one thing run.sh cannot bound — a
    # `compose up --build` or an ssh to a wedged sshd that simply never returns.
    timeout-minutes: 15
    steps:
      # `persist-credentials: false`, for the reason the check job gives.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned toolchain
        run: rustup toolchain install --profile minimal --no-self-update

      # The binaries go into Debian containers, so they are built static against musl rather
      # than the runner's glibc. run.sh refuses rather than guesses if this is missing.
      - run: rustup target add x86_64-unknown-linux-musl

      # Two workspaces: the crate under test and e2e-tests/probe, which is separate for the
      # reason fuzz/ is. No `key:` of its own, unlike `fuzz` and `release`. Those two build with
      # the nightly from scripts/nightly-version, which rust-cache cannot see and so cannot key
      # on; this job builds with the stable pin from rust-toolchain.toml, which rust-cache reads
      # itself, and with the two lock files it already hashes. A key naming the container files
      # was strictly worse than none: rust-cache carries the user key into its restore key too,
      # so it has no fallback, and every edit to the Dockerfile or the compose file threw away a
      # 26 MB cache that has nothing to do with either. Five consecutive runs logged
      # "No cache found." and three separate lineages were written and never read.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            .
            e2e-tests/probe

      # The only lint pass e2e-tests/probe gets, exactly as the fuzz job's clippy is the only one
      # fuzz/ gets: the clippy hook reaches the root workspace alone, and until this the third
      # workspace had `cargo fmt --check` and nothing else. Whether the probe is correct decides
      # whether the matrix below means anything, so it is the wrong file to lint least. Here and
      # not in `check` because this job already caches that workspace's target directory; measured
      # at about five seconds against a warm one. Before `run.sh`, so a lint failure costs nothing
      # rather than six booted containers. The deny rides on the command, this job having no
      # job-level RUSTFLAGS to put it in.
      - run: cargo clippy --locked --manifest-path e2e-tests/probe/Cargo.toml --all-targets -- -D warnings

      # Fails on any cell whose measured verdict differs from matrix.tsv's prediction, in either
      # direction: a cell that survives where the file says it dies is as much a finding as the
      # reverse, and both mean the file and the world have to be reconciled before merge.
      - run: sh e2e-tests/run.sh

  # The 400 KiB budget is correctness-adjacent — the cold upload happens over cellular — and is
  # the one thing the local hooks cannot check.
  release:
    name: musl release builds
    runs-on: ubuntu-24.04
    # The weekly schedule exists for the advisory check alone; see the trigger comment above.
    if: github.event_name != 'schedule'
    timeout-minutes: 30
    steps:
      # `persist-credentials: false`, for the reason the check job gives.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No toolchain step: scripts/build-release.sh installs the shared nightly, its sources,
      # llvm-tools and both musl targets itself, in one idempotent `rustup toolchain install`. It
      # owns the target list and the compiler, so it owns fetching them, and the cache key follows
      # both the script and the file that names the compiler.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: musl-${{ hashFiles('scripts/build-release.sh', 'scripts/nightly-version') }}

      - run: sh scripts/build-release.sh

      # `check_leaks` in that script proves only that no path *it* derived survives in an artifact;
      # it cannot see one rustc spelled differently. This rebuilds the same commit from another
      # checkout path, $CARGO_HOME and target directory and requires the two SHA256SUMS to agree,
      # which is the property a client pinning them depends on. `git archive HEAD` is exactly the
      # committed tree and leaves target/ behind, so the rebuild is cold; RUSTUP_HOME is shared on
      # purpose, the toolchain being an input both builds are meant to agree on. It runs on pull
      # requests too: this job is required before auto-merge, so reproducibility is a precondition
      # of protected main rather than a failure first discovered after the merge.
      - name: Rebuild from another path and compare the checksums
        run: |
          rebuild="$RUNNER_TEMP/nomux-rebuild"
          mkdir -p "$rebuild"
          git archive --format=tar HEAD | tar -x -C "$rebuild"
          CARGO_HOME="$RUNNER_TEMP/cargo-rebuild" sh "$rebuild/scripts/build-release.sh"
          if ! diff -u target/dist/SHA256SUMS "$rebuild/target/dist/SHA256SUMS"; then
              echo "the same commit built different bytes from a different path:" >&2
              echo "  the remap flags in scripts/build-release.sh no longer cover" >&2
              echo "  everything rustc records, so the checksums a client pins are" >&2
              echo "  this machine's rather than this commit's." >&2
              exit 1
          fi

      # Binary distributions carry the licence beside the two artifacts. It is outside
      # SHA256SUMS, whose names are the architecture choices the client makes; immutable release
      # attestations cover every published asset as a set.
      - run: cp LICENSE target/dist/LICENSE

      # The checksums are the point of this job — the client pins one per architecture — so they
      # have to outlive the log they were printed to. On a tag the release below is where they
      # land; this keeps every other commit's set reachable for the ninety days an artifact lasts.
      # Also on failure: build-release.sh disarms its cleanup trap before the size gates, so an
      # over-budget build keeps its binaries for whoever has to measure them, and dropping them
      # here would undo that. `ignore` follows — a failure earlier than that is the trap firing.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: success() || failure()
        with:
          name: musl-binaries
          path: target/dist/
          if-no-files-found: ignore

  # Download, verify and exercise the published artifact on both native architectures.
  smoke:
    name: release smoke (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    if: github.event_name != 'schedule'
    needs: release
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: musl-binaries
          path: target/dist

      - name: Verify the downloaded artifact
        working-directory: target/dist
        run: sha256sum -c SHA256SUMS

      # Covers the release-only std, panic and linker configuration through a real PTY lifecycle.
      - name: Run the binary that ships
        run: |
          binary="target/dist/nomux-${{ matrix.target }}"
          chmod +x "$binary"
          "$binary" --version
          sh scripts/smoke-release.sh "$binary"

  smoke-gate:
    name: downloaded release smoke
    runs-on: ubuntu-24.04
    if: always() && github.event_name != 'schedule'
    needs: smoke
    steps:
      - name: Require every native smoke test
        env:
          RESULT: ${{ needs.smoke.result }}
        run: test "$RESULT" = success

  # The checksums need a permanent, public home; a workflow artifact expires after ninety days
  # and sits behind a login. Its own job because it needs every test and artifact job — so a
  # tag cannot publish a release whose tests failed — and because it is the only one that wants a
  # write token, which is why the others keep the read-only one the header grants. The smoke job
  # rehearses the same download and checksum boundary on every pull request; only creation of the
  # public release remains tag-gated.
  publish:
    name: publish the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, fuzz, e2e, release, smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # No checkout: everything published is in the artifact, and the tag is named by the ref.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: musl-binaries
          path: dist

      # The check every download page asks a user to run, run here first — against the artifact
      # that came back out of the store rather than the one that went in. It also settles what is
      # present: `sha256sum -c` fails on a file it cannot open.
      - name: Verify the artifact against its own checksums
        working-directory: dist
        run: sha256sum -c SHA256SUMS

      # Artifacts do not carry the executable bit and the step below runs one; no bearing on what
      # is published, every install path chmods it anyway.
      - run: chmod +x dist/nomux-*

      # Asked of the artifact rather than read out of Cargo.toml: the tag's whole job is to name
      # what these binaries are, and the x86_64 musl binary is static-pie on an x86_64 runner, so
      # the one witness can simply be asked. Before anything is published, a tag not being quietly
      # correctable — the sums under `v0.1.0` are what a client pins.
      - name: Check the tag names the version the binaries report
        run: |
          built=$(dist/nomux-x86_64-unknown-linux-musl --version)
          case "$built" in
          "nomux ${GITHUB_REF_NAME#v} "*) ;;
          *)
              echo "the tag $GITHUB_REF_NAME does not name what the binaries report:" >&2
              echo "  $built" >&2
              echo "  move the workspace version in Cargo.toml, or retag." >&2
              exit 1
              ;;
          esac

      # `SHA256SUMS` goes up beside the binaries it covers, in the format `sha256sum -c` reads, so
      # verifying needs no API and no tooling. Repository-level immutable releases lock the tag
      # and every asset after publication and issue an attestation for the set. With assets on the
      # command line, `gh release create` stages a draft, uploads all of them, then publishes it;
      # no partial set is public. `--verify-tag` refuses to invent a missing ref.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          notes="$RUNNER_TEMP/notes.md"
          {
              echo "Static Linux binaries, one per architecture. Verify with:"
              echo
              echo '```sh'
              echo 'sha256sum -c SHA256SUMS'
              echo '```'
              echo
              echo '```'
              cat dist/SHA256SUMS
              echo '```'
          } > "$notes"
          # Exactly what the manifest names, rather than a `dist/nomux-*` glob. Counted, because
          # `set -e` does not see into a process substitution — a failed awk would publish a
          # manifest and no binaries, and a tag cannot be amended.
          mapfile -t assets < <(awk '{print "dist/" $2}' dist/SHA256SUMS)
          if [ "${#assets[@]}" -ne 2 ]; then
              echo "the manifest names ${#assets[@]} files, not the expected 2:" >&2
              printf '  %s\n' "${assets[@]}" >&2
              exit 1
          fi
          gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes \
              --notes-file "$notes" \
              --verify-tag \
              "${assets[@]}" dist/SHA256SUMS dist/LICENSE
