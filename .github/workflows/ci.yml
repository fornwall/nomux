name: CI

on:
  push:
    branches: [main]
  pull_request:

# A pushed fixup makes the run it superseded worthless; don't pay for it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # A failure in the PTY suite is awkward to reproduce off the runner, so keep the
  # backtrace in the log.
  RUST_BACKTRACE: 1

jobs:
  # The prek gate, run in the same cheapest-first order. One job, so the workspace
  # and its dependencies are compiled against a single cache.
  check:
    name: fmt, clippy, tests
    runs-on: ubuntu-latest
    # The session tests spawn a real PTY, shells and unix sockets; a wedged child
    # would otherwise hold the runner for the six-hour default.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      # Bare `toolchain install` reads rust-toolchain.toml, so the 1.97.1 pin and
      # its components stay stated in exactly one place.
      - name: Install the pinned toolchain
        run: rustup toolchain install --profile minimal --no-self-update

      - uses: Swatinem/rust-cache@v2

      # Prebuilt binary; `cargo install` would build nextest from source on every
      # cache miss.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      # First, as in the prek config this job mirrors: it is the cheapest check
      # here and the only one that looks at the shell. Both scripts had defects
      # that no Rust hook could have seen, and until this step existed the gate
      # was local-only — so a `--no-verify` commit, or a contributor who had not
      # run `prek install`, landed unchecked shell. `shellcheck` is preinstalled
      # on the runner image.
      #
      # Every tracked `*.sh`, not `scripts/*.sh`: the prek hook matches the path
      # suffix wherever it lands, and the two sets are equal only for as long as no
      # shell script lives outside scripts/. The gate that runs on a `--no-verify`
      # commit is the wrong one to have checking less than the local hook does.
      - run: git ls-files -z '*.sh' | xargs -0 -r shellcheck --shell=sh

      - run: cargo fmt --all --check

      # No `-D warnings`: the deny lives in [workspace.lints], so cargo, clippy and
      # rust-analyzer agree without RUSTFLAGS-induced cache thrash. See README § Build.
      - run: cargo clippy --locked --workspace --all-targets

      # `--run-ignored all`: the one ignored test sits out a real reaping timeout,
      # the 30 s first-attach one. Too slow for a pre-commit hook, exactly what
      # CI is for.
      # `--no-fail-fast`: one failure should not hide the state of everything
      # else, which is most of the value of a CI run over a local one.
      - run: cargo nextest run --locked --workspace --run-ignored all --no-fail-fast

      # nextest cannot run doctests.
      - run: cargo test --locked --doc --workspace

  # Its own job: the script rebuilds the whole workspace under
  # `--cfg nomux_fault_injection`, which shares no artifacts with the job above, and
  # keeping it parallel leaves it off the critical path.
  takeover-guard:
    name: takeover guard
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Install the pinned toolchain
        run: rustup toolchain install --profile minimal --no-self-update

      - uses: Swatinem/rust-cache@v2
        with:
          # Separate target directory, separate fingerprints, separate cache.
          key: fault-injection

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      # Asserts the regression test still fails on the pre-fix ordering; a guard that
      # passes on the bug guards nothing.
      - run: sh scripts/verify-takeover-guard.sh

  # The 400 KiB budget is correctness-adjacent — the cold upload happens over
  # cellular — and is the one thing the local hooks cannot check.
  release:
    name: musl release builds
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      # Read rather than repeated here: scripts/build-release.sh defaults to the same
      # file, so this job and a laptop build use one compiler and their sizes are
      # comparable against a baseline recorded by it. A literal in this file left the
      # script free to float, which is how a local run comes to fail on growth nobody
      # introduced. Dated, never floating: the client pins a SHA-256 per architecture,
      # and a compiler that moves moves those bytes underneath it.
      - name: Read the pinned release nightly
        run: echo "NOMUX_NIGHTLY=$(cat scripts/nightly-version)" >> "$GITHUB_ENV"

      # The shipping build rebuilds std with panics compiled out, which is the only
      # configuration that meets the size budget (IMPLEMENTATION.md § 8) and needs a
      # nightly compiler plus its sources. No cross linker to install: rust-lld and
      # the musl objects that ship with each rust-std component are the whole
      # toolchain.
      - name: Install the release nightly with the musl targets
        run: >
          rustup toolchain install "$NOMUX_NIGHTLY" --profile minimal --no-self-update
          --component rust-src
          --target x86_64-unknown-linux-musl,aarch64-unknown-linux-musl,armv7-unknown-linux-musleabihf,riscv64gc-unknown-linux-musl

      - uses: Swatinem/rust-cache@v2
        with:
          key: musl-${{ env.NOMUX_NIGHTLY }}

      # Owns the target list and the size budget; exits non-zero if a binary is over.
      - run: sh scripts/build-release.sh

      # The checksums are the point of this job — the client pins one per
      # architecture — so they have to outlive the log they were printed to.
      - uses: actions/upload-artifact@v4
        with:
          name: musl-binaries
          path: target/dist/
          if-no-files-found: error

