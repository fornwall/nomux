name: CI

on:
  push:
    branches: [main]
    # A `v*` tag is what publishes a release; the `publish` job at the bottom is what
    # does it, from the artifact the release job built rather than from a build of its
    # own. Promoting those exact bytes is what makes the published checksums the ones
    # the size gate and `SHA256SUMS` were computed over — a rebuild would be
    # byte-identical by § 8, but "would be" is a claim and this is not one.
    tags: ['v*']
  pull_request:
  # The release job's artifacts expire, and it is the only producer of the
  # per-architecture binaries and their checksums. Without this, getting them back
  # means an empty commit.
  workflow_dispatch:

# Cancel superseded branch runs; let `main` finish, since each commit there is a
# distinct set of musl artifacts that nothing else produces.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # A failure in the PTY suite is awkward to reproduce off the runner, so keep the
  # backtrace in the log.
  RUST_BACKTRACE: 1

# Third-party actions are pinned to a commit, not to a tag: the release job below
# builds the binaries whose SHA-256 the client is designed to pin, and a tag is a
# mutable pointer in someone else's repository. The version rides in the trailing
# comment, since the SHA does not say which one it is. The `actions/*` steps stay on
# their major tag deliberately — GitHub's own, inside a trust boundary the job is
# already entirely within.
jobs:
  # The prek gate, run in the same cheapest-first order. One job, so the workspace
  # and its dependencies are compiled against a single cache.
  check:
    name: fmt, clippy, tests
    runs-on: ubuntu-latest
    # The session tests spawn a real PTY, shells and unix sockets; a wedged child
    # would otherwise hold the runner for the six-hour default.
    timeout-minutes: 20
    # Where the deny lives, and the reason it is here rather than in
    # [workspace.lints] is written down in Cargo.toml: cargo inlines that table into
    # the published manifest, so a deny there is a stranger's build failure on any
    # toolchain newer than the pin. Here it reaches this job and nothing else.
    #
    # Job-level rather than repeated per step, so every cargo invocation below sees
    # the same value: RUSTFLAGS is part of cargo's fingerprint and of the rust-cache
    # key, and a step that differed would rebuild the workspace from cold.
    #
    # Deliberately not on the release job: scripts/build-release.sh sets
    # CARGO_ENCODED_RUSTFLAGS, which makes cargo ignore RUSTFLAGS entirely, so a deny
    # there would be silently absent rather than enforced — and lint gating is this
    # job's business anyway.
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7

      # Bare `toolchain install` reads rust-toolchain.toml, so the 1.97.1 pin and
      # its components stay stated in exactly one place.
      - name: Install the pinned toolchain
        run: rustup toolchain install --profile minimal --no-self-update

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      # Prebuilt binary; `cargo install` would build nextest from source on every
      # cache miss.
      - uses: taiki-e/install-action@67729d5c413db75907f0ad1e39bb04b9c868ff60 # v2.85.7
        with:
          tool: cargo-nextest

      # Every tracked `*.sh`, not `scripts/*.sh`: the prek hook matches the path
      # suffix wherever it lands, and the gate that runs on a `--no-verify` commit is
      # the wrong one to have checking less than the local hook does.
      # `shell: bash` for the `-o pipefail` it brings: the default `bash -e {0}` has
      # none, so a failing `git ls-files` would be masked by the zero `xargs` exits
      # when handed nothing, and the step would pass having checked no files.
      - run: git ls-files -z '*.sh' | xargs -0 -r shellcheck --shell=sh
        shell: bash

      - run: cargo fmt --all --check

      # `-- -D warnings` on top of the job's RUSTFLAGS: clippy's own lints are emitted
      # by clippy-driver, and the flags after `--` are the ones it applies to them.
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings

      # rustdoc has its own lint namespace, so `rustdoc::broken_intra_doc_links` is
      # reached by neither the clippy run above nor RUSTFLAGS — and this tree links
      # between items constantly, where a renamed function turns a link into nothing
      # rather than into an error. `--document-private-items` because the binary crate
      # is almost entirely private and would otherwise be documented empty. Seconds
      # against the warm cache: only the workspace crates are rebuilt, their
      # dependencies having been built by the step above.
      - run: RUSTDOCFLAGS='-D warnings' cargo doc --locked --workspace --no-deps --document-private-items

      # `--run-ignored all`: the one ignored test sits out a real reaping timeout,
      # the 30 s first-attach one. Too slow for a pre-commit hook, exactly what
      # CI is for.
      # `--no-fail-fast`: one failure should not hide the state of everything
      # else, which is most of the value of a CI run over a local one.
      - run: cargo nextest run --locked --workspace --run-ignored all --no-fail-fast

      # nextest cannot run doctests.
      - run: cargo test --locked --doc --workspace

  # Its own job: the script rebuilds `nomux` and its session tests under
  # `--cfg nomux_fault_injection`, which shares no artifacts with the job above, and
  # keeping it parallel leaves it off the critical path.
  takeover-guard:
    name: takeover guard
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Here too, because this is the only job that compiles the fault-injection code at
    # all: the check job above never sets those cfgs, so a warning behind one is
    # otherwise seen by nothing. verify-takeover-guard.sh appends its `--cfg` to an
    # inherited RUSTFLAGS rather than replacing it, so the deny survives into both of
    # its runs.
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7

      - name: Install the pinned toolchain
        run: rustup toolchain install --profile minimal --no-self-update

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          # Separate target directory, separate fingerprints, separate cache.
          key: fault-injection

      - uses: taiki-e/install-action@67729d5c413db75907f0ad1e39bb04b9c868ff60 # v2.85.7
        with:
          tool: cargo-nextest

      # Asserts the regression test still fails on the pre-fix ordering; a guard that
      # passes on the bug guards nothing.
      - run: sh scripts/verify-takeover-guard.sh

  # The 400 KiB budget is correctness-adjacent — the cold upload happens over
  # cellular — and is the one thing the local hooks cannot check.
  release:
    name: musl release builds
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # Read rather than repeated here: scripts/build-release.sh defaults to the same
      # file, so this job and a laptop build use one compiler and their sizes are
      # comparable against a baseline recorded by it. A literal here would let the two
      # drift, which is how a local run comes to fail on growth nobody introduced.
      #
      # A plain assignment rather than `echo "...=$(cat ...)"`, because the default
      # shell is `bash -e` without `pipefail`: a failing substitution inside `echo`
      # does not fail `echo`, so a renamed or missing file left this step green with
      # an empty value — for the one file that names the release compiler. `set -e`
      # does fail an assignment whose substitution failed.
      #
      # An output rather than $GITHUB_ENV, which would put the toolchain name in the
      # environment of every later step including the build, where nothing should be
      # reading a compiler from anywhere but the pinned file. As an output it reaches
      # only the step below, so build-release.sh reads scripts/nightly-version itself
      # — the same branch a laptop build takes.
      - name: Read the pinned release nightly
        id: nightly
        run: |
          nightly=$(cat scripts/nightly-version)
          # Checked rather than passed on, because two readers parse this file and
          # they parse it differently: build-release.sh takes it whole with `cat`,
          # while $GITHUB_OUTPUT is line-oriented, so a second line would install one
          # compiler and build with another. Empty is the same class of problem from
          # the other side — `cat` succeeds on an empty file, so the assignment above
          # cannot catch it, and the failure surfaces a step later as a rustup usage
          # error about a file this step has already read. One plain toolchain name
          # is all either reader accepts; anything else stops here, next to the file.
          case "$nightly" in
              '' | *[!A-Za-z0-9._-]*)
                  echo "scripts/nightly-version names the release compiler and must" >&2
                  echo "  hold one plain toolchain name; it holds: '$nightly'" >&2
                  exit 1
                  ;;
          esac
          echo "version=$nightly" >> "$GITHUB_OUTPUT"

      # The shipping build rebuilds std with panics compiled out, which needs a
      # nightly compiler plus its sources (IMPLEMENTATION.md § 8). `llvm-tools` is for
      # the debug companions: the script checks each one against the binary it
      # describes with `llvm-objcopy`, and the host's binutils cannot be assumed to
      # read riscv64 or armv7.
      #
      # Through `env:` and a quoted expansion, not `${{ }}` spliced into the script:
      # on a pull request the file's contents are the contributor's, and a value
      # interpolated into `run:` is executed rather than passed.
      - name: Install the release nightly with the musl targets
        env:
          RELEASE_NIGHTLY: ${{ steps.nightly.outputs.version }}
        run: >
          rustup toolchain install "$RELEASE_NIGHTLY" --profile minimal --no-self-update
          --component rust-src,llvm-tools
          --target x86_64-unknown-linux-musl,aarch64-unknown-linux-musl

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: musl-${{ steps.nightly.outputs.version }}

      # Owns the target list and the size budget; exits non-zero if a binary is over.
      #
      # The companions are asked for everywhere except a pull request. Building them
      # doubles the cross builds — a second `-Zbuild-std` fat-LTO link per target —
      # for artifacts that only the tag path ever publishes, and a PR's expire unread.
      # `main` and tags still build them, so the script's `.text` correspondence check
      # between each shipping binary and its companion keeps running on every commit
      # that could ship, rather than first on the tag that does. `0` rather than an
      # unset value because the script tests the variable for exactly `1`.
      - run: sh scripts/build-release.sh
        env:
          NOMUX_DEBUG: ${{ github.event_name == 'pull_request' && '0' || '1' }}

      # The checksums are the point of this job — the client pins one per
      # architecture — so they have to outlive the log they were printed to. On a tag
      # the release below is where they actually land; this keeps every other commit's
      # set reachable for the ninety days an artifact lasts.
      - uses: actions/upload-artifact@v7
        with:
          name: musl-binaries
          path: target/dist/
          if-no-files-found: error

  # What P3 asked for: the checksums somewhere a client can read them. An artifact
  # expires after ninety days and sits behind a login; a release asset does neither.
  #
  # Its own job for two reasons. It `needs` all three above, so a tag cannot publish a
  # release whose tests failed — parallel jobs with no dependency would have raced, and
  # the release build passing says only that the binaries fit, not that they work. And
  # it is the only job that wants a write token, so it is the only one that gets one;
  # the other three keep the read-only token the header grants.
  publish:
    name: publish the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, takeover-guard, release]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # No checkout: everything published is in the artifact, and the tag is named by
      # the ref rather than read out of the tree.
      - uses: actions/download-artifact@v7
        with:
          name: musl-binaries
          path: dist

      # The check every download page asks a user to run, run here first — against the
      # artifact that came back out of the store rather than the one that went in. It
      # also settles what is present: `sha256sum -c` fails on a file it cannot open, so
      # a manifest naming something the build did not emit stops here.
      - name: Verify the artifact against its own checksums
        working-directory: dist
        run: |
          sha256sum -c SHA256SUMS
          sha256sum -c SHA256SUMS.debug

      # Artifacts do not carry the executable bit, and the step below runs one of these
      # to ask it its version. It has no bearing on what is published — a release asset
      # is a plain file and every install path chmods it anyway.
      - run: chmod +x dist/nomux-*

      # Asked of the artifact rather than read out of Cargo.toml, because the tag's
      # whole job is to name what these binaries are, and Cargo.toml is not what
      # anyone downloads. The musl x86_64 binary is static-pie and the runner is
      # x86_64, so the one witness to the version that ships can simply be asked.
      #
      # Checked before anything is published, because a tag cannot be quietly corrected
      # afterwards: the sums under `v0.1.0` are what a client pins, and a `v0.2.0`
      # carrying 0.1.0 binaries is a release that has to be deleted rather than amended.
      - name: Check the tag names the version the binaries report
        run: |
          built=$(dist/nomux-x86_64-unknown-linux-musl --version)
          case "$built" in
          "nomux ${GITHUB_REF_NAME#v} "*) ;;
          *)
              echo "the tag $GITHUB_REF_NAME does not name what the binaries report:" >&2
              echo "  $built" >&2
              echo "  move the workspace version in Cargo.toml, or retag." >&2
              exit 1
              ;;
          esac

      # `SHA256SUMS` goes up beside the binaries it covers, in the format `sha256sum -c`
      # already reads, so verifying needs no API and no tooling. GitHub computes its own
      # immutable SHA-256 per asset at upload time on top of that, exposed as `digest`
      # on the releases API — worth having both, since the file is portable and signed
      # by nothing while the digest is GitHub's and cannot be rewritten afterwards.
      #
      # The body carries the sums inline as well, so the number a human is asked to
      # compare is on the page they are already reading.
      #
      # `--verify-tag` so a ref that names no tag fails here rather than creating one
      # against a commit nobody tagged.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          notes="$RUNNER_TEMP/notes.md"
          {
              echo "Static Linux binaries, one per architecture. Verify with:"
              echo
              echo '```sh'
              echo 'sha256sum -c SHA256SUMS'
              echo '```'
              echo
              echo '```'
              cat dist/SHA256SUMS
              echo '```'
              echo
              echo "### Debug companions"
              echo
              echo "\`nomux-<target>.debug\` is the same build unstripped, for reading a"
              echo "\`SIGQUIT\` core against — the shipping binaries carry no symbols and"
              echo "abort without a message. Nothing needs them to run nomux. Their own"
              echo "sums are in \`SHA256SUMS.debug\`."
              echo
              echo '```'
              cat dist/SHA256SUMS.debug
              echo '```'
          } > "$notes"
          # Exactly what the two manifests name, rather than a `dist/nomux-*` glob that
          # would happen to sweep the companions in beside the binaries. The build
          # script makes the same distinction for the same reason — the two sets are
          # checksummed separately and a glob does not know which is which — and a
          # release that carried a file no manifest covers would be a release nobody
          # could verify.
          mapfile -t assets < <(awk '{print "dist/" $2}' dist/SHA256SUMS dist/SHA256SUMS.debug)
          gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --notes-file "$notes" \
              --verify-tag \
              "${assets[@]}" dist/SHA256SUMS dist/SHA256SUMS.debug

