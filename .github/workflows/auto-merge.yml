name: Auto-merge trusted pull requests

# Owner PRs use `pull_request_target`, so this trusted path always runs from the protected base
# branch. Dependabot is deliberately handled on `pull_request` instead: GitHub forces the token
# for a Dependabot-authored `pull_request_target` run to read-only even when a job requests write
# permission. Nothing here checks out the pull request; CI remains the authority on its tree.
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  owner:
    name: enable for owner PR
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.user.login == github.repository_owner &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.pull_request.draft &&
      github.event.pull_request.auto_merge == null
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      # GitHub requires both permissions to enable native auto-merge. They apply only to this job;
      # the workflow-level token has no permissions at all.
      contents: write
      pull-requests: write
    steps:
      - name: Enable auto-merge after every branch rule passes
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --merge "$PR_URL"

  verify_dependabot:
    name: verify compatible dependency update
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      !github.event.pull_request.draft &&
      github.event.pull_request.auto_merge == null
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      dependency-names: ${{ steps.metadata.outputs.dependency-names }}
      update-type: ${{ steps.metadata.outputs.update-type }}
    steps:
      # Besides exposing the semantic update type, this rejects a PR whose author or commits do
      # not verify as Dependabot's. This third-party code gets a read-only token; the separate job
      # below is the only Dependabot path that gets write permission. Pin the action just as CI
      # pins every executable action.
      - name: Verify the Dependabot PR and read its update type
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

  dependabot:
    name: enable for compatible dependency update
    needs: verify_dependabot
    if: >-
      !contains(needs.verify_dependabot.outputs.dependency-names, 'actions/download-artifact') &&
      !contains(needs.verify_dependabot.outputs.dependency-names, 'dependabot/fetch-metadata') &&
      (needs.verify_dependabot.outputs.update-type == 'version-update:semver-patch' ||
       needs.verify_dependabot.outputs.update-type == 'version-update:semver-minor')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      # Major upgrades remain reviewed. So do the action that runs later with the release job's
      # write token and the metadata action that decides this policy; neither executes its
      # privileged path on its own update PR. Every other patch and minor update still waits for
      # every branch rule and required check before this pending decision takes effect.
      - name: Enable auto-merge for patch and minor updates
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --merge "$PR_URL"
