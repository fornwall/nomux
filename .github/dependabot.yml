version: 2

updates:
  # Keep the artifact producer and consumer compatible across major updates.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
      time: "05:17"
      timezone: Europe/Stockholm
    groups:
      artifacts:
        patterns: ["actions/upload-artifact", "actions/download-artifact"]
      minor-and-patch-actions:
        patterns: ["*"]
        exclude-patterns: ["actions/upload-artifact", "actions/download-artifact"]
        update-types: ["minor", "patch"]

  # Patch groups auto-merge; minor and major updates remain review-only.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: daily
      time: "05:27"
      timezone: Europe/Stockholm
    groups:
      patch-cargo:
        patterns: ["*"]
        update-types: ["patch"]
      security-patch-cargo:
        applies-to: security-updates
        patterns: ["*"]
        update-types: ["patch"]

  # fuzz/ is a separate workspace and lockfile.
  - package-ecosystem: cargo
    directory: /fuzz
    schedule:
      interval: daily
      time: "05:37"
      timezone: Europe/Stockholm
    groups:
      patch-fuzz-cargo:
        patterns: ["*"]
        update-types: ["patch"]
      security-patch-fuzz-cargo:
        applies-to: security-updates
        patterns: ["*"]
        update-types: ["patch"]
