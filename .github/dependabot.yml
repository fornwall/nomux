version: 2

# Dependabot cannot update the pinned stable and nightly toolchains; those stay manual. CI's
# weekly advisory check covers dependency risk while the tree is otherwise idle.
updates:
  # The executable actions are commit-pinned, so Dependabot is what moves each pin. Daily checks
  # keep that supply chain current; grouping keeps the resulting pull-request stream small.
  #
  # The two artifact actions are grouped because one hands its output to the other, and
  # ungrouped they arrive as separate pull requests: the `download-artifact` half goes green
  # on its own, `publish` being tag-gated, so a major that no longer reads what the other
  # wrote is not discovered until the tag that needed it.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
      time: "05:17"
      timezone: Europe/Stockholm
    groups:
      artifacts:
        patterns: ["actions/upload-artifact", "actions/download-artifact"]
      minor-and-patch-actions:
        patterns: ["*"]
        exclude-patterns: ["actions/upload-artifact", "actions/download-artifact"]
        update-types: ["minor", "patch"]

  # Patch groups auto-merge; minor and major updates remain review-only.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: daily
      time: "05:27"
      timezone: Europe/Stockholm
    groups:
      patch-cargo:
        patterns: ["*"]
        update-types: ["patch"]
      security-patch-cargo:
        applies-to: security-updates
        patterns: ["*"]
        update-types: ["patch"]

  # Separate lockfile and policy: these crates do not ship, but their build scripts execute
  # on developer and CI machines and should not silently age outside the advisory gate.
  - package-ecosystem: cargo
    directory: /fuzz
    schedule:
      interval: daily
      time: "05:37"
      timezone: Europe/Stockholm
    groups:
      patch-fuzz-cargo:
        patterns: ["*"]
        update-types: ["patch"]
      security-patch-fuzz-cargo:
        applies-to: security-updates
        patterns: ["*"]
        update-types: ["patch"]
