version: 2

# Two pins are covered by no ecosystem below: the stable channel in
# `rust-toolchain.toml` and the dated nightly in `scripts/nightly-version`. That is accepted
# rather than automated because Dependabot cannot update either file. The nightly decides
# the bytes of a binary whose SHA-256 a client pins, so a bump needs a release build and size
# review (and a `scripts/size-baseline` refresh if that review accepts material growth). A
# stable bump can land a new wall of lints on a tree whose gates deny warnings. Both therefore
# move in a reviewed commit carrying whatever else the compiler bump requires.
#
# What that leaves unattended is a compiler-side fix nobody notices. It is the dependency
# tree — everybody else's code, which is the larger surface — that the weekly `schedule:` in
# .github/workflows/ci.yml watches on a timer, running the whole workflow and with it
# `cargo deny check advisories`, precisely because those move without this repository moving.
updates:
  # Action majors are tracked by a moving tag, minors are not; without this the
  # workflow silently ages.
  #
  # The two artifact actions are grouped because one hands its output to the other, and
  # ungrouped they arrive as separate pull requests: the `download-artifact` half goes green
  # on its own, `publish` being tag-gated, so a major that no longer reads what the other
  # wrote is not discovered until the tag that needed it.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      artifacts:
        patterns: ["actions/upload-artifact", "actions/download-artifact"]

  # The dependency tree is small and the binary ships to servers, so take patches.
  # Grouped: separate PRs per crate is noise at this size.
  #
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    groups:
      cargo:
        patterns: ["*"]

  # Separate lockfile and policy: these crates do not ship, but their build scripts execute
  # on developer and CI machines and should not silently age outside the advisory gate.
  - package-ecosystem: cargo
    directory: /fuzz
    schedule:
      interval: monthly
    groups:
      fuzz-cargo:
        patterns: ["*"]
