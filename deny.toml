# Offline policy runs in the commit gate; CI also checks the advisory database.

[advisories]
ignore = []
unsound = "all"
yanked = "deny"

[licenses]
allow = ["Apache-2.0", "MIT"]

[bans]
multiple-versions = "deny"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
