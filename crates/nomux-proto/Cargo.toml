[package]
name = "nomux-proto"
description = "Wire protocol codec for nomux persistent SSH terminal sessions"
# Not published. A version on crates.io is a semver promise about the API, and this
# crate's API *is* the wire format — which DESIGN.md § 2 says is private, unstable and
# spoken by exactly one client, shipped in lockstep. `PROTOCOL_VERSION` is the real
# compatibility axis, and it answers a peer rather than a resolver. Publishing also
# cost the workspace manifest a literal `version` beside the path dependency, since a
# published path dep needs one, duplicating `workspace.package.version` with nothing
# keeping the two in step. The crate stays split out for the reason
# IMPLEMENTATION.md § 1 gives — it is the half that can carry `#![forbid(unsafe_code)]`.
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# Literal rather than inherited: an inherited `README.md` resolves against the
# workspace root, and cargo then rewrites it to the crate's own copy while warning
# that it did. Same packaged file either way, one fewer warning on every publish.
readme = "README.md"
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

# The default `fork` and `timeout` features run every case in a subprocess so a
# hang or an abort can be attributed. This codec allocates nothing it does not
# bound and loops over nothing, so a case that neither returns nor panics is not a
# failure mode worth paying `rusty-fork`, `tempfile` and `wait-timeout` for. Same
# for `bit-set`, which only accelerates shrinking of bitset strategies this suite
# does not use.
[dev-dependencies]
proptest = { version = "1.11.0", default-features = false, features = ["std"] }

[lints]
workspace = true
