[package]
name = "nomux-proto"
description = "Wire protocol codec for nomux persistent SSH terminal sessions"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# Literal rather than inherited: an inherited `README.md` resolves against the
# workspace root, and cargo then rewrites it to the crate's own copy while warning
# that it did. Same packaged file either way, one fewer warning on every publish.
readme = "README.md"
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

# The default `fork` and `timeout` features run every case in a subprocess so a
# hang or an abort can be attributed. This codec allocates nothing it does not
# bound and loops over nothing, so a case that neither returns nor panics is not a
# failure mode worth paying `rusty-fork`, `tempfile` and `wait-timeout` for. Same
# for `bit-set`, which only accelerates shrinking of bitset strategies this suite
# does not use.
[dev-dependencies]
proptest = { version = "1.11.0", default-features = false, features = ["std"] }

[lints]
workspace = true
