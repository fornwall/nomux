[package]
name = "nomux"
description = "Persistent PTY sessions that survive SSH disconnects, with zero server-side install"
# The library exposes a private, unstable wire protocol (DESIGN.md § 2).
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
rustix = { version = "1.1.4", features = ["pty", "termios", "process", "event", "fs", "pipe", "stdio"] }
# Raw signal, fork, and AF_UNIX calls that rustix does not expose with these features.
libc = "0.2.189"

[lints]
workspace = true
