[package]
name = "nomux"
description = "Persistent PTY sessions that survive SSH disconnects, with zero server-side install"
# Unpublishable while it depends on an unpublished, versionless `nomux-proto`.
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
nomux-proto.workspace = true
rustix = { version = "1.1.4", features = ["pty", "termios", "process", "event", "fs", "pipe", "stdio"] }
# The declarations and syscalls rustix does not wrap, or puts in its `runtime` module
# and documents as unusable in a process that has a libc — which this one does, via
# std. Chiefly the seccomp BPF filter and `prctl`, the signal handlers,
# `fork`/`_exit`/`waitpid`, and the raw AF_UNIX socket calls; `grep -r 'libc::'` for
# the current set rather than trusting this list to have kept up.
libc = "0.2.189"

[lints]
workspace = true
