[package]
name = "nomux"
description = "Persistent PTY sessions that survive SSH disconnects, with zero server-side install"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# Literal rather than inherited: an inherited `README.md` resolves against the
# workspace root, and cargo then rewrites it to the crate's own copy while warning
# that it did. Same packaged file either way, one fewer warning on every publish.
readme = "README.md"
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
nomux-proto.workspace = true
rustix = { version = "1.1.4", features = ["pty", "termios", "process", "event", "fs", "pipe", "stdio"] }
# For `signal`, `fork` and `_exit`, which rustix puts in its `runtime` module —
# documented as unusable in a process that has a libc, which this one does via std —
# and for the one `getsockopt` in `control::peer_pid`, where rustix's own
# `socket_peercred` is unsound against an answer the kernel really gives. Declarations
# only, so it costs nothing in the binary, and it is already in the tree beneath
# rustix.
libc = "0.2.189"

[lints]
workspace = true
