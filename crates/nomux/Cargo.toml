[package]
name = "nomux"
description = "Persistent PTY sessions that survive SSH disconnects, with zero server-side install"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
readme.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
nomux-proto.workspace = true
rustix = { version = "1.1.4", features = ["pty", "termios", "process", "event", "fs", "stdio", "pipe"] }
# Only for `signal`: rustix's equivalent lives in its `runtime` module, which is
# documented as unusable in a process that has a libc — which this one does, via
# std. Declarations only, so it costs nothing in the binary, and it is already in
# the tree beneath rustix.
libc = "0.2.189"

[lints]
workspace = true
