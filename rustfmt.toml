# Deliberately empty. rustfmt walks up from each file it formats until it finds a
# rustfmt.toml, and does not stop at the workspace root — so without this file the
# search leaves the checkout and picks up whatever config happens to sit above it,
# in ~ or in a parent of wherever the tree was cloned. That formats a developer's
# working copy differently from `cargo fmt --all --check` on the runner, which is a
# disagreement the gate reports and cannot explain. Existing is this file's whole
# job; the first one found wins, and one holding only comments still wins.
#
# `style_edition = "2024"` used to be here and did nothing: rustfmt takes the style
# edition from the edition cargo passes it, every crate in the workspace inherits
# edition 2024, and formatting is byte-identical with the key and without it. A line
# that reads as configuration and configures nothing is worse than no line, since the
# next person to touch it has to rediscover that.
