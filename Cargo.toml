[workspace]
resolver = "3"
members = ["crates/nomux", "crates/nomux-proto"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.97.1"
license = "Apache-2.0"
repository = "https://github.com/fornwall/nomux"
authors = ["Fredrik Fornwall <fredrik@fornwall.net>"]
keywords = ["ssh", "terminal", "pty", "session"]
categories = ["command-line-utilities"]

[workspace.dependencies]
nomux-proto = { path = "crates/nomux-proto" }

# See IMPLEMENTATION.md § 8 — the cold upload happens over cellular, so size is a
# correctness-adjacent concern. Target <= 400 KiB per architecture.
[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

# Every lint below stays at "warn"; the deny lives in the gates, in
# .pre-commit-config.yaml. A deny here would escape the repository — cargo inlines this
# table into the published manifest, so it becomes a stranger's `cargo install nomux`
# failure on any toolchain past the pin. `future_incompatible` is the sharpest edge:
# that group is designed to gain members every release, each one an instant hard error.
[workspace.lints.rust]
# Fault injection for the test suite, never set in a shipped build. Declared so
# `cfg!` on it is not itself a warning — which the gates would turn into an error.
unexpected_cfgs = { level = "warn", check-cfg = [
    "cfg(nomux_fault_injection)",
    "cfg(nomux_fault_settle)",
] }
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"
unused_lifetimes = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
future_incompatible = { level = "warn", priority = -1 }
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
# Unavoidable in any real dependency tree; not actionable.
multiple_crate_versions = "allow"
# Directly contradicts `unreachable_pub`: in a binary every module is private, so
# this lint wants bare `pub` while `unreachable_pub` wants `pub(crate)`. Keep the
# explicit form, which says what it means and greps cleanly.
redundant_pub_crate = "allow"
# Selected restriction lints. A daemon that panics loses the user's session.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
indexing_slicing = "warn"
undocumented_unsafe_blocks = "warn"
missing_assert_message = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
mem_forget = "warn"
dbg_macro = "warn"
str_to_string = "warn"
