[workspace]
resolver = "3"
members = ["crates/nomux"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/fornwall/nomux"
authors = ["Fredrik Fornwall <fredrik@fornwall.net>"]

# See IMPLEMENTATION.md § 8 — the cold upload happens over cellular, so size is a
# correctness-adjacent concern. Target <= 400 KiB per architecture.
[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

# Every lint below stays at "warn"; the deny lives in the gates, in
# .pre-commit-config.yaml, so a toolchain bump is a red gate rather than a tree that will
# not build. No rustc *group* is named: a level applies to a group's members downwards.
[workspace.lints.rust]
# No `unexpected_cfgs` entry: it existed only to declare the three `nomux_fault_*` cfgs the
# fault-injection guards compiled under, and both the cfgs and the guards are gone — what
# they demonstrated is asserted by unit tests now. The lint is on by default, so nothing was
# lost by dropping the declaration, and a cfg nobody declared warns again as it should.
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"
unused_lifetimes = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
elided_lifetimes_in_paths = "warn"
explicit_outlives_requirements = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
# No `clippy::cargo`: complete metadata, two pinned dependencies and no features satisfy
# every member of it by construction, and deny.toml is where bans and licences are checked.
# Directly contradicts `unreachable_pub`: in a binary every module is private, so
# this lint wants bare `pub` while `unreachable_pub` wants `pub(crate)`. Keep the
# explicit form, which says what it means and greps cleanly.
redundant_pub_crate = "allow"
# Selected restriction lints. A daemon that panics loses the user's session.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
indexing_slicing = "warn"
undocumented_unsafe_blocks = "warn"
missing_assert_message = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
mem_forget = "warn"
dbg_macro = "warn"
str_to_string = "warn"
