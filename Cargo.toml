[workspace]
resolver = "3"
members = ["crates/nomux", "crates/nomux-proto"]

[workspace.package]
version = "0.1.0"
edition = "2024"
readme = "README.md"
rust-version = "1.97.1"
license = "MIT OR Apache-2.0"
repository = "https://github.com/fornwall/nomux"
authors = ["Fredrik Fornwall <fredrik@fornwall.net>"]
keywords = ["ssh", "terminal", "pty", "session"]
categories = ["command-line-utilities"]

[workspace.dependencies]
nomux-proto = { path = "crates/nomux-proto", version = "0.1.0" }

# See IMPLEMENTATION.md § 8 — the cold upload happens over cellular, so size is a
# correctness-adjacent concern. Target <= 400 KiB per architecture.
[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

[workspace.lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"
unused_lifetimes = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
future_incompatible = { level = "warn", priority = -1 }
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
# Unavoidable in any real dependency tree; not actionable.
multiple_crate_versions = "allow"
# Selected restriction lints. A daemon that panics loses the user's session.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
indexing_slicing = "warn"
unwrap_in_result = "warn"
undocumented_unsafe_blocks = "warn"
missing_assert_message = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
mem_forget = "warn"
dbg_macro = "warn"
str_to_string = "warn"
