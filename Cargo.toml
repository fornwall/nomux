[workspace]
resolver = "3"
members = ["crates/nomux"]

[workspace.package]
version = "0.5.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/fornwall/nomux"
authors = ["Fredrik Fornwall <fredrik@fornwall.net>"]

# Release artifacts must stay below 400 KiB (IMPLEMENTATION.md § 8).
[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

[workspace.lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"
unused_lifetimes = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
elided_lifetimes_in_paths = "warn"
explicit_outlives_requirements = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
# This conflicts with `unreachable_pub` for binary-private modules.
redundant_pub_crate = "allow"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
indexing_slicing = "warn"
undocumented_unsafe_blocks = "warn"
missing_assert_message = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
mem_forget = "warn"
dbg_macro = "warn"
str_to_string = "warn"
