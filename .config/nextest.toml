# Bound stalled tests; ordinary tests get 40 seconds.
[profile.default]
slow-timeout = { period = "20s", terminate-after = 2 }

# This ignored test intentionally waits through the 30-second first-attach timeout,
# and measures 33 s doing it. Three periods is 60 s: room for a loaded machine, and
# not the 100 s that would let a genuine hang sit for a minute and a half.
[[profile.default.overrides]]
filter = 'test(=a_daemon_nobody_ever_attaches_to_reaps_itself)'
slow-timeout = { period = "20s", terminate-after = 3 }
