# A bound on how long a test may take. Without it nextest's default slow-timeout
# prints a warning and then waits for ever, so a session test whose daemon never
# answers holds the runner with no failing test to point at.
#
# Twenty seconds is well clear of the slowest ordinary test; terminating at four
# periods leaves room for `a_daemon_nobody_ever_attaches_to_reaps_itself`, which sits
# out a real 30-second first-attach deadline and which CI runs with
# `--run-ignored all`. So the kill is a backstop for a test that has outlived its own
# patience, never the thing that decides a result.
[profile.default]
slow-timeout = { period = "20s", terminate-after = 4 }
