# A bound on how long a test may take. Without it nextest's default slow-timeout prints a
# warning and then waits for ever, so a session test whose daemon never answers holds the
# runner with no failing test to point at.
#
# Twenty seconds clears the slowest ordinary test, which finishes in ten. Forty is a backstop
# against a run that has stopped making progress, and deliberately not a ceiling above every
# deadline a test gives itself. No test's budget multiplies any more — `Session::connect_by`
# hands a reconnecting loop the caller's deadline, so its rounds share one `FRAME_PATIENCE`
# instead of owing fifteen seconds each — but a test that waits for several things one after
# another is still bounded by their sum, and a dozen of them sum past forty:
# `input_delivered_before_a_half_close_is_applied_rather_than_dropped` is the worst at 85
# seconds, made of a start-up, two clients, a cue and two polls, none of them renewed.
#
# The cost of that is real and worth naming rather than papering over: a test slow enough to
# reach forty is reported slow rather than on the wait it was actually owed, and for chaos.rs
# without the seed that would reproduce it. What removes it is one deadline per test rather
# than one per phase (`tests/harness/mod.rs`'s `poll_by`), and not a larger number here.
[profile.default]
slow-timeout = { period = "20s", terminate-after = 2 }

# The one exception, and the reason the budget above is not simply everyone's:
# `a_daemon_nobody_ever_attaches_to_reaps_itself` sits out a real deadline of the daemon's
# rather than waiting for something to happen — 30 seconds of first-attach timeout, and it
# waits 45 for the socket to go. Five periods rather than four, because four is where it lands
# under the regression it exists to catch: that 45 runs in full only when the daemon overstays,
# and behind an attach and a second session it puts the assertion at 80 — racing the kill that
# was meant to be safely behind it. CI is what runs this, with `--run-ignored all`.
[[profile.default.overrides]]
filter = 'test(=a_daemon_nobody_ever_attaches_to_reaps_itself)'
slow-timeout = { period = "20s", terminate-after = 5 }
