# A bound on how long a test may take. Without it nextest's default slow-timeout
# prints a warning and then waits for ever, so a session test whose daemon never
# answers holds the runner with no failing test to point at.
#
# Twenty seconds is well clear of the slowest ordinary test, which finishes in six.
# Terminating at two periods puts the kill at forty, above every *single* wait any
# test makes: the longest are the thirty seconds a chaos workload is given, the
# twenty-five the four directions of a relay share, and the twenty a spawn race is
# allowed. So a test that outlives one wait fails on that wait and says which.
#
# What this cannot promise, and used to claim, is that the kill "is never the thing
# that decides a result". A test that makes several waits one after another is
# bounded by their sum, and several here can add up past forty — the refusal table in
# tests/session.rs runs five rows of a handful of fifteen-second waits each, and any
# test that starts a session has that daemon's own ten before it begins. Every one of
# those is a wait for something that has already happened or never will, so in
# practice they cost milliseconds; the exposure is that a genuinely wedged daemon can
# still be killed from outside rather than reported from within.
#
# The mitigation is one deadline per test rather than one per wait, which is what
# `join_before` and `poll_by` in tests/harness/mod.rs exist for, and what the relay
# and chaos tests now use. It was written down here because two of them were well
# past the kill and neither was visibly wrong: the chaos tests allowed themselves a
# minute, which also lost the seed IMPLEMENTATION.md § 9 promises every failure
# carries, and the relay tests four consecutive thirty-second joins.
[profile.default]
slow-timeout = { period = "20s", terminate-after = 2 }

# The one exception, and the reason the budget above is not simply everyone's:
# `a_daemon_nobody_ever_attaches_to_reaps_itself` sits out a real deadline of the
# daemon's rather than waiting for something to happen — 30 seconds of first-attach
# timeout, and it waits 45 for the socket to go. Forty is not room for that, and
# raising the default to fit it hands every other test a ceiling twice what it needs,
# so the four periods stay here where they are earned. CI is what runs this, with
# `--run-ignored all`.
[[profile.default.overrides]]
filter = 'test(=a_daemon_nobody_ever_attaches_to_reaps_itself)'
slow-timeout = { period = "20s", terminate-after = 4 }
