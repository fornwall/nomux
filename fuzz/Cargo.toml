# Keep libFuzzer and its release profile outside the shipping workspace.
[workspace]

[package]
name = "nomux-fuzz"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4.13"
nomux_protocol = { package = "nomux", path = "../crates/nomux" }

# Preserve line tables in fuzz crash reports.
[profile.release]
debug = 1

[[bin]]
name = "frame"
path = "fuzz_targets/frame.rs"
test = false
doc = false
bench = false
