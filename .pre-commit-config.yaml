# Run with prek (https://github.com/j178/prek):
#   prek install            install .git/hooks/pre-commit
#   prek run --all-files    run every hook over the whole tree
#
# This file is the gate. .github/workflows/ci.yml runs `prek run --all-files` rather
# than restating these commands, so a hook and the CI step that enforces it cannot
# drift apart; the two things CI adds on top — rustdoc, and the ignored test — are
# there as steps of their own because neither belongs in a pre-commit hook.
#
# Hooks are ordered cheapest-first so an obvious failure reports fast.
# They trigger on Rust sources and on manifests, since the lint configuration
# itself lives in Cargo.toml.
#
# `--locked` on every compiling cargo hook: without it a hook may quietly update
# Cargo.lock to make itself pass. `cargo fmt` resolves nothing and rejects the flag
# outright, so it is the one hook without it.
repos:
  - repo: local
    hooks:
      # Two files, compared as text. Every build here and in CI installs its toolchain
      # from rust-toolchain.toml, so all of them are MSRV builds — but only while the two
      # strings agree, and `clippy::incompatible_msrv` catches std-API drift alone.
      - id: msrv-is-the-pinned-toolchain
        name: rust-toolchain.toml and rust-version name the same compiler
        entry: |
          sh -c '
          pinned=$(awk -F\" "/^channel *=/ { print \$2; exit }" rust-toolchain.toml)
          msrv=$(awk -F\" "/^rust-version *=/ { print \$2; exit }" Cargo.toml)
          if [ -z "$pinned" ] || [ "$pinned" != "$msrv" ]; then
              echo "the toolchain CI builds with is not the MSRV the crate declares:" >&2
              echo "  rust-toolchain.toml channel: '"'"'$pinned'"'"'" >&2
              echo "  Cargo.toml rust-version:     '"'"'$msrv'"'"'" >&2
              echo "  move both, or the declared MSRV is tested by nothing." >&2
              exit 1
          fi
          '
        language: system
        files: '^(rust-toolchain\.toml|Cargo\.toml)$'
        pass_filenames: false

      # ci.yml carries ~60 lines of embedded shell that the hook below never sees —
      # it matches `*.sh`. actionlint shellchecks every `run:` block and validates the
      # workflow schema besides, which is the half of that file nothing else reads.
      #
      # From $PATH, as shellcheck below is. CI installs the released binary by
      # checksum, so what fails a build is a pinned version; a laptop running a newer
      # one may find more, which is the same deal shellcheck already has here.
      - id: actionlint
        name: actionlint
        entry: actionlint
        language: system
        files: '^\.github/workflows/.*\.ya?ml$'
        pass_filenames: false

      # Every tracked `*.sh`, matched by path suffix wherever it lands, rather than
      # `scripts/*.sh`.
      - id: shellcheck
        name: shellcheck
        entry: shellcheck --shell=sh
        language: system
        files: '\.sh$'

      - id: cargo-fmt
        name: cargo fmt --check
        entry: cargo fmt --all --check
        language: system
        files: '(\.rs|\.toml)$|^Cargo\.lock$'
        pass_filenames: false

      # `-- -D warnings` rather than a deny in [workspace.lints], for the reason
      # Cargo.toml gives: a toolchain bump should redden this gate, not break the build.
      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --locked --workspace --all-targets -- -D warnings
        language: system
        files: '(\.rs|\.toml)$|^Cargo\.lock$'
        pass_filenames: false

      - id: cargo-nextest
        name: cargo nextest run
        entry: cargo nextest run --locked --workspace
        language: system
        files: '(\.rs|\.toml)$|^Cargo\.lock$'
        pass_filenames: false

      # nextest cannot run doctests, so they need their own pass or doc
      # examples silently go unexercised.
      - id: cargo-doctest
        name: cargo test --doc
        entry: cargo test --locked --doc --workspace
        language: system
        files: '(\.rs|\.toml)$|^Cargo\.lock$'
        pass_filenames: false
