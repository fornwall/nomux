# Run with prek (https://github.com/j178/prek):
#   prek install            install .git/hooks/pre-commit
#   prek run --all-files    run every hook over the whole tree
repos:
  - repo: local
    hooks:
      - id: section-references-resolve
        name: every § names a section that exists
        entry: sh scripts/check-references.sh
        language: system
        files: '\.(rs|md|sh|toml|ya?ml)$|^scripts/'
        pass_filenames: false

      - id: actionlint
        name: actionlint
        entry: actionlint
        language: system
        files: '^\.github/workflows/.*\.ya?ml$'
        pass_filenames: false

      - id: shellcheck
        name: shellcheck
        entry: shellcheck --shell=sh
        language: system
        files: '\.sh$'

      - id: cargo-fmt
        name: cargo fmt --check
        entry: cargo fmt --all --check
        language: system
        files: '\.rs$|^rustfmt\.toml$'
        pass_filenames: false

      # fuzz/ is a separate workspace.
      - id: cargo-fmt-fuzz
        name: cargo fmt --check (fuzz)
        entry: cargo fmt --manifest-path fuzz/Cargo.toml --all --check
        language: system
        files: '^fuzz/.*\.(rs|toml)$|^rustfmt\.toml$'
        pass_filenames: false

      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --locked --workspace --all-targets -- -D warnings
        language: system
        files: '(\.rs|\.toml)$|^Cargo\.lock$'
        pass_filenames: false

      - id: cargo-nextest
        name: cargo nextest run
        entry: cargo nextest run --locked --workspace
        language: system
        files: '(\.rs|\.toml)$|^Cargo\.lock$'
        pass_filenames: false

      # Advisory checks remain in CI because they require the network.
      - id: cargo-deny
        name: cargo deny check bans licenses sources
        entry: cargo deny --locked check bans licenses sources
        language: system
        files: '(^|/)Cargo\.toml$|^Cargo\.lock$|^deny\.toml$'
        pass_filenames: false

      - id: cargo-deny-fuzz
        name: cargo deny fuzz sources
        entry: cargo deny --locked --manifest-path fuzz/Cargo.toml --config fuzz/deny.toml check sources
        language: system
        files: '^fuzz/(Cargo\.toml|Cargo\.lock|deny\.toml)$|^crates/nomux/Cargo\.toml$'
        pass_filenames: false
