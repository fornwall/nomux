# Run with prek (https://github.com/j178/prek):
#   prek install            install .git/hooks/pre-commit
#   prek run --all-files    run every hook over the whole tree
#
# Hooks are ordered cheapest-first so an obvious failure reports fast.
# They trigger on Rust sources and on manifests, since the lint configuration
# itself lives in Cargo.toml.
#
# `--locked` on every compiling cargo hook, matching .github/workflows/ci.yml: without
# it a hook may quietly update Cargo.lock to make itself pass. `cargo fmt` resolves
# nothing and rejects the flag outright, so it is the one hook without it.
repos:
  - repo: local
    hooks:
      - id: shellcheck
        name: shellcheck
        entry: shellcheck --shell=sh
        language: system
        files: '\.sh$'

      - id: cargo-fmt
        name: cargo fmt --check
        entry: cargo fmt --all --check
        language: system
        files: '(\.rs|\.toml)$|^Cargo\.lock$'
        pass_filenames: false

      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --locked --workspace --all-targets
        language: system
        files: '(\.rs|\.toml)$|^Cargo\.lock$'
        pass_filenames: false

      - id: cargo-nextest
        name: cargo nextest run
        entry: cargo nextest run --locked --workspace
        language: system
        files: '(\.rs|\.toml)$|^Cargo\.lock$'
        pass_filenames: false

      # nextest cannot run doctests, so they need their own pass or doc
      # examples silently go unexercised.
      - id: cargo-doctest
        name: cargo test --doc
        entry: cargo test --locked --doc --workspace
        language: system
        files: '(\.rs|\.toml)$|^Cargo\.lock$'
        pass_filenames: false
